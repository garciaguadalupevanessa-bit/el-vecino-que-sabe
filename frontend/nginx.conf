server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy no-referrer always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'" always;

  # Forwards the API to the backend inside the Docker Compose network (no CORS)
  location /api/ {
    client_max_body_size 10m;   # voice recordings for /api/transcribe
    resolver 127.0.0.11 valid=10s;
    set $backend http://backend:8000;
    proxy_pass $backend;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_read_timeout 100s;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
