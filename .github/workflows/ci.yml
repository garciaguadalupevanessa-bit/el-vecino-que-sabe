name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (pytest + Postgres)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: elvecino
          POSTGRES_PASSWORD: elvecino_test
          POSTGRES_DB: elvecinoquesabe_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U elvecino -d elvecinoquesabe_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Script syntax
        run: bash -n ../scripts/doctor.sh ../scripts/refresh-bdns-production.sh
      - name: Tests (data from JSON, no LLM, no network)
        run: pytest -v
        env:
          DATABASE_URL: ""
      - name: Postgres integration tests
        run: pytest tests/test_db.py -v
        env:
          TEST_DATABASE_URL: postgresql://elvecino:elvecino_test@localhost:5432/elvecinoquesabe_test

  frontend:
    name: Frontend (tests + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          # Once package-lock.json exists: cache: npm and cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Tests
        run: npm test
      - name: Build
        run: npm run build

  docker:
    name: Docker Compose (smoke test)
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Prepare the test .env
        run: cp .env.example .env
      - name: Build and start
        run: docker compose up -d --build --wait --wait-timeout 180
      - name: Backend responds and uses Postgres
        run: |
          curl -fsS http://localhost:8000/api/health | tee health.json
          grep -q '"data_source":"postgres"' health.json
      - name: Frontend serves the app and forwards /api to the backend
        run: |
          curl -fsS http://localhost:3000/ | grep -q "El Vecino que Sabe"
          curl -fsS http://localhost:3000/api/health
      - name: Logs if something failed
        if: failure()
        run: docker compose logs --no-color
      - name: Clean up
        if: always()
        run: docker compose down -v
