services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: elvecino
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-elvecino_dev}
      POSTGRES_DB: elvecinoquesabe
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432"     # only reachable from your machine
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U elvecino -d elvecinoquesabe"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql://elvecino:${POSTGRES_PASSWORD:-elvecino_dev}@db:5432/elvecinoquesabe
    ports: ["${BACKEND_HOST_PORT:-8000}:8000"]
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend/data:/app/data   # seed JSON files, editable without rebuilding the image
      - ./backend/app:/app/app     # auto-reload in development
      - ./backend/scripts:/app/scripts
      - ./docs:/app/docs           # scripts can save samples here
      - bdns_documents:/app/storage/bdns
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  frontend:
    build: ./frontend
    ports: ["${FRONTEND_HOST_PORT:-3000}:80"]
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 15s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
  bdns_documents:
